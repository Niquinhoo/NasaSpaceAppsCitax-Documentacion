name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Higiene del repositorio
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Sin marcadores de conflicto
        run: |
          if git grep -nE '^(<{7}|>{7})( |$)|^={7}$' -- . ; then
            echo "::error::Hay marcadores de conflicto de merge sin resolver."
            exit 1
          fi

      # GitHub rechaza archivos de más de 100 MB y advierte desde 50 MB.
      - name: Sin archivos pesados
        run: |
          status=0
          while IFS= read -r -d '' f; do
            size=$(stat -c %s "$f")
            if [ "$size" -gt 52428800 ]; then
              echo "::error file=$f::$f pesa $((size / 1048576)) MB (máximo 50 MB)."
              status=1
            fi
          done < <(git ls-files -z)
          exit $status

      - name: Links relativos válidos en Markdown
        run: |
          broken=0
          while IFS= read -r -d '' md; do
            dir=$(dirname "$md")
            while IFS= read -r link; do
              case "$link" in *://*|mailto:*) continue ;; esac
              if [ ! -e "$dir/$link" ]; then
                echo "::error file=$md::Link roto: $link"
                broken=$((broken + 1))
              fi
            done < <(grep -oE '\]\([^)#[:space:]]+' "$md" | sed 's/^](//' || true)
          done < <(git ls-files -z -- '*.md')
          [ "$broken" -eq 0 ]
